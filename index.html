<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsuna — Connect & Build Together</title>
    <meta name="description" content="Social collaboration platform for artists, builders, coders, creators, and communities to connect, share work, and build together." />
    <meta property="og:title" content="Tsuna — Connect & Build Together" />
    <meta property="og:description" content="Social collaboration platform for artists, builders, coders, creators, and communities to connect, share work, and build together." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tsuna_theme') || 'dark';
          if (t === 'light' || t === 'high-contrast' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light', 'theme-light');
            } else if (t === 'high-contrast') {
              document.documentElement.classList.remove('light');
              document.documentElement.classList.add('dark', 'theme-high-contrast', 'high-contrast');
            } else {
              document.documentElement.classList.remove('light');
              document.documentElement.classList.add('dark', 'theme-dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
